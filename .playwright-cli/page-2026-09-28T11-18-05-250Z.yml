          - list [ref=f4e62]:
            - listitem [ref=f4e63]:
              - generic [ref=f4e67]: Gemini 3.8 Flash became generally available and enabled by default in the app for global, US, and EU regions on September 23, 2026.
            - listitem [ref=f4e68]:
              - generic [ref=f4e72]: Support for registering A2UI and A2A agents reached general availability in August; Workspace and Cloud agent features still have separate product boundaries.
            - listitem [ref=f4e73]:
              - generic [ref=f4e77]: Custom skills and Pay-as-you-go are recent additions, while connector additions are published with their own preview or GA status.
            - listitem [ref=f4e78]:
              - generic [ref=f4e82]: Region, feature toggles, account eligibility, and edition still matter; consult release notes before relying on a capability.
        - generic [ref=f4e83]:
          - paragraph [ref=f4e84]:
            - text: Google's Gemini Enterprise release notes are the best place to check product changes because they label announcements by date and status. This snapshot reflects the official notes available on September 28, 2026; the documentation may change after this guide is published.
            - link "Jump to source 1" [ref=f4e85] [cursor=pointer]:
              - /url: "#source-1"
              - text: "[1]"
          - 'heading "September: Gemini 3.8 Flash" [level=3] [ref=f4e86]'
          - paragraph [ref=f4e87]:
            - text: "On September 23, Google marked Gemini 3.8 Flash generally available and enabled by default in the Gemini Enterprise app in the global, US, and EU regions. Administrators can manage model availability. Regional routing details matter: enabling models in unsupported in-country regions can route traffic to the global endpoint, which has different residency implications."
            - link "Jump to source 1" [ref=f4e88] [cursor=pointer]:
              - /url: "#source-1"
              - text: "[1]"
          - 'heading "August: agents, skills, and data sources" [level=3] [ref=f4e89]'
          - paragraph [ref=f4e90]:
            - text: Google moved registration and management support for A2UI and A2A agents to general availability on August 17, including A2UI v0.9 support. Separately, custom skills became generally available on August 13, with administrator settings for enabling, managing availability, and approving sharing.
            - link "Jump to source 1" [ref=f4e91] [cursor=pointer]:
              - /url: "#source-1"
              - text: "[1]"
          - paragraph [ref=f4e92]:
            - text: The release notes also list new data stores and connector actions in preview. Preview status is not the same as general availability and may have product, region, or support constraints. Check the individual connector setup documentation and edition matrix before designing around a source.
            - link "Jump to source 1" [ref=f4e93] [cursor=pointer]:
              - /url: "#source-1"
              - text: "[1]"
            - link "Jump to source 2" [ref=f4e94] [cursor=pointer]:
              - /url: "#source-2"
              - text: "[2]"
          - heading "Pay-as-you-go and purchasing" [level=3] [ref=f4e95]
          - paragraph [ref=f4e96]:
            - text: Google announced Pay-as-you-go general availability on August 1, with charges based on consumed features rather than pooled user-license quotas. The rollout is gradual, and Google requires an invoiced Cloud Billing account. The product page still describes limited availability and excludes Gemini Notebook at present; confirm eligibility and current inclusion with Google Cloud.
            - link "Jump to source 1" [ref=f4e97] [cursor=pointer]:
              - /url: "#source-1"
              - text: "[1]"
            - link "Jump to source 3" [ref=f4e98] [cursor=pointer]:
              - /url: "#source-3"
              - text: "[3]"
          - heading "How to use release notes responsibly" [level=3] [ref=f4e99]
          - paragraph [ref=f4e100]: For a deployment decision, record the feature's status (GA, preview, or limited availability), product surface, edition, region, required admin switch, and source documentation. Recheck these items during procurement and before each rollout phase; release status can change quickly.
