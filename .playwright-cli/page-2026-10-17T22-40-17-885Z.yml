                  - text: ) and a response template (for example,
                  - code [ref=f1e203]: ge-model-responses
                  - text: "). Match the app’s region: for a Global app choose the US or EU multi-region; for a US or EU app choose its matching multi-region. Project, region, and template ID cannot be changed after creation."
                - listitem [ref=f1e204]:
                  - strong [ref=f1e205]: 4. Configure prompt detections.
                  - text: For the user-prompt template, enable prompt injection and jailbreak detection, malicious URI screening, and the sensitive-data checks appropriate to your policy. Google recommends focusing this template on risky inputs; responsible-AI filters can be disabled here because Gemini has built-in user-prompt checks.
