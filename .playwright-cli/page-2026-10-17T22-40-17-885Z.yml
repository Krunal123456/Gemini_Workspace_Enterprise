            - heading "What Model Armor templates are—and what they are not" [level=2] [ref=f1e168]
            - paragraph [ref=f1e169]: A Model Armor template is a reusable security policy for screening prompts and model responses. It stores enabled detection filters, confidence thresholds, enforcement behavior, region, and related settings. It is not an agent template, a prompt library, or a finished “Model Armor model.” For Gemini Enterprise, Google recommends separate templates for user prompts and response outputs because the two sides have different risks.
          - generic [ref=f1e170]:
            - article [ref=f1e171]:
              - heading "Prompt input template" [level=3] [ref=f1e172]
              - paragraph [ref=f1e173]: Prompt injection and jailbreak detection; sensitive-data detections appropriate to your data. Focus on blocking malicious or risky input before it reaches a model.
            - article [ref=f1e174]:
              - heading "Response output template" [level=3] [ref=f1e175]
              - paragraph [ref=f1e176]: Sensitive-data detections, relevant responsible-AI categories, and malicious URL detection. Focus on preventing unsafe or disallowed material from reaching the user.
          - generic [ref=f1e177]:
            - article [ref=f1e178]:
              - heading "What the filters inspect" [level=3] [ref=f1e179]
              - list [ref=f1e180]:
                - listitem [ref=f1e181]:
                  - strong [ref=f1e182]: "Prompt injection and jailbreaks:"
                  - text: instructions attempting to bypass the agent’s intended boundaries.
                - listitem [ref=f1e183]:
                  - strong [ref=f1e184]: "Responsible AI categories:"
                  - text: configurable categories such as hate, harassment, sexually explicit, and dangerous content; CSAM has its own default behavior.
                - listitem [ref=f1e185]:
                  - strong [ref=f1e186]: "Sensitive Data Protection:"
                  - text: detect configured sensitive information types; the available basic and advanced configuration choices differ.
                - listitem [ref=f1e187]:
                  - strong [ref=f1e188]: "Malicious URLs:"
                  - text: screen URLs in prompts or generated responses.
              - paragraph [ref=f1e189]: Thresholds are confidence levels, not “weak/medium/strong model” settings. Lower thresholds can increase false positives. Tune each category against representative good and bad examples.
