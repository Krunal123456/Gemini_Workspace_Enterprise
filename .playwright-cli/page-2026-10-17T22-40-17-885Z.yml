            - list [ref=f1e224]:
              - listitem [ref=f1e225]: For the Gemini Enterprise app integration, Google says not to enable the prompt-injection detector on responses; it can add false positives and latency.
              - listitem [ref=f1e226]: Model Armor does not remove or mask PII. Sensitive Data Protection can block source material, but its content policies are unavailable for Gemini Enterprise Business edition.
