        - generic [ref=f6e58]:
          - heading "Key Executive Takeaways" [level=2] [ref=f6e59]
          - list [ref=f6e62]:
            - listitem [ref=f6e63]:
              - generic [ref=f6e67]: Google's Workspace feature tables distinguish core Gemini features from advanced features and list availability by edition and add-on.
            - listitem [ref=f6e68]:
              - generic [ref=f6e72]: Gemini in Workspace apps, the Gemini app, and Gemini Notebook have separate access and usage limits.
            - listitem [ref=f6e73]:
              - generic [ref=f6e77]: Workspace Intelligence lets administrators control which Workspace sources Gemini can search, and it respects the user's existing content permissions.
            - listitem [ref=f6e78]:
              - generic [ref=f6e82]: Google's current edition tables contain promotional access and scheduled limit changes; recheck the official comparison before setting expectations.
        - generic [ref=f6e83]:
          - paragraph [ref=f6e84]:
            - text: Google Workspace does not offer one identical Gemini allowance across every plan. Google's current Workspace comparison separates Gemini features from advanced Gemini features and shows availability and usage by Business edition, Enterprise edition, and AI Expanded Access. Starter, Standard, Plus, and Enterprise should therefore be compared against the exact feature your team needs, not grouped under a single 'Gemini included' label.
            - link "Jump to source 1" [ref=f6e85] [cursor=pointer]:
              - /url: "#source-1"
              - text: "[1]"
            - link "Jump to source 2" [ref=f6e86] [cursor=pointer]:
              - /url: "#source-2"
              - text: "[2]"
          - heading "Keep the Gemini surfaces distinct" [level=3] [ref=f6e87]
          - paragraph [ref=f6e88]:
            - text: Google documents separate limits for Gemini features inside Workspace apps and for the Gemini app. Gemini Notebook has its own access levels as well. A limit in one product surface should not be assumed to represent the allowance in another. Check Google's live feature and usage tables for the specific surface and plan.
            - link "Jump to source 1" [ref=f6e89] [cursor=pointer]:
              - /url: "#source-1"
              - text: "[1]"
            - link "Jump to source 2" [ref=f6e90] [cursor=pointer]:
              - /url: "#source-2"
              - text: "[2]"
          - heading "Workspace Intelligence and source access" [level=3] [ref=f6e91]
          - paragraph [ref=f6e92]:
            - text: Workspace Intelligence can provide Gemini context from Gmail, Drive and Docs (including Sheets, Slides, PDFs, images, and Vids), Calendar, and Chat. Administrators can turn individual source services on or off; Google says changes may take up to 48 hours. The feature respects the user's existing permissions, so Gemini should only ground responses in material that person can access.
            - link "Jump to source 3" [ref=f6e93] [cursor=pointer]:
              - /url: "#source-3"
              - text: "[3]"
          - heading "Plan and rollout checks" [level=3] [ref=f6e94]
          - paragraph [ref=f6e95]:
            - text: Before purchase or launch, confirm the edition and add-on, the exact Gemini feature and product surface, user-level limits, administrative source settings, region and rollout status, and whether a promotional allowance has an end date. The published plan page can show temporary pricing or feature promotions, while the Help Center tables describe service availability and limits. Compare both close to the decision date.
            - link "Jump to source 1" [ref=f6e96] [cursor=pointer]:
              - /url: "#source-1"
              - text: "[1]"
            - link "Jump to source 2" [ref=f6e97] [cursor=pointer]:
              - /url: "#source-2"
              - text: "[2]"
            - link "Jump to source 4" [ref=f6e98] [cursor=pointer]:
              - /url: "#source-4"
              - text: "[4]"
          - paragraph [ref=f6e99]:
            - text: As of September 28, 2026, Google's Workspace edition tables identify some promotional access with scheduled limit enforcement dates, including Workspace Studio on October 1. Treat date-specific allowances as a snapshot and verify the updated table after a policy or rollout date passes.
            - link "Jump to source 1" [ref=f6e100] [cursor=pointer]:
              - /url: "#source-1"
              - text: "[1]"
            - link "Jump to source 2" [ref=f6e101] [cursor=pointer]:
              - /url: "#source-2"
              - text: "[2]"
