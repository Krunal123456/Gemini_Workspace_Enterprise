        - 'heading "Gemini in Google Workspace: What editions include and how limits differ" [level=1] [ref=f6e50]'
        - paragraph [ref=f6e51]: Separate AI inside Workspace apps from the Gemini app, Notebook, and optional expanded access when comparing plans.
        - generic [ref=f6e52]:
          - generic [ref=f6e53]: MS
          - generic [ref=f6e54]:
            - generic [ref=f6e55]: MarketStar Research
