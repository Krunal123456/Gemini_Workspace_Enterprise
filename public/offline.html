<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0f19">
    <title>You're offline · MarketStar</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #111827; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #e2e8f0; border-radius: 24px; background: white; box-shadow: 0 18px 60px -36px #0f172a66; }
      img { width: 174px; height: 44px; object-fit: contain; object-position: left center; padding: 8px 10px; border-radius: 10px; background: #101827; }
      h1 { margin: 28px 0 8px; font-size: 26px; line-height: 1.2; letter-spacing: -0.04em; }
      p { margin: 0; color: #64748b; }
      button { margin-top: 24px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: #111827; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/marketstar-logo.png" alt="MarketStar">
      <h1>You're offline</h1>
      <p>Reconnect to continue exploring Workspace and Gemini capabilities.</p>
      <button onclick="location.reload()">Try again · Intentar de nuevo</button>
      <p lang="es" style="margin-top:16px;font-size:14px">Sin conexión. Vuelve a conectarte para seguir explorando las funciones de Workspace y Gemini.</p>
    </main>
  </body>
</html>
